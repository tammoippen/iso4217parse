name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['pypy-3.11', '3.11', '3.12', '3.13', '3.14']
        include:
        - os: ubuntu-latest
          path: ~/.cache/pip
        - os: macos-latest
          path: ~/Library/Caches/pip
        - os: windows-latest
          path: ~\AppData\Local\pip\Cache
        exclude:
        - os: macos-latest
          python-version: 'pypy-3.11'
        - os: windows-latest
          python-version: 'pypy-3.11'
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: UTF-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Install
        id: restore-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.path }}
            poetry.lock
          key: ${{ matrix.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.4'
          virtualenvs-create: false

      - name: Install
        run: poetry install

      - name: Style
        if: ${{ ! startsWith(matrix.python-version, 'pypy-') && startsWith(matrix.os, 'ubuntu') }}
        run: make check

      - name: Tests
        run: make test

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
