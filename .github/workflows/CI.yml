name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['pypy-3.11', '3.11', '3.12', '3.13', '3.14']
        include:
        - os: ubuntu-latest
          path: ~/.cache/pip
        - os: macos-latest
          path: ~/Library/Caches/pip
        - os: windows-latest
          path: ~\AppData\Local\pip\Cache
        exclude:
        - os: macos-latest
          python-version: 'pypy-3.11'
        - os: windows-latest
          python-version: 'pypy-3.11'
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: UTF-8
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ matrix.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install
        run: uv sync --locked

      - name: Style
        if: ${{ ! startsWith(matrix.python-version, 'pypy-') && startsWith(matrix.os, 'ubuntu') }}
        run: make check

      - name: Tests
        run: make test

      - name: Minimize uv cache
        run: uv cache prune --ci

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
